<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Loan Calculator</h1>
        <p>Cумма Кредита
            <input onchange="calculateLoan()" class="input" type="number" id="Сумма-кредита"
            min="1" max="500000" value="10000">
        </p>
        <p>Протцентная Ставка %
            <input onchange="calculateLoan()" class="input" type="number" id="Проценая-ставка"
            min="0" max="100" value="10">
        </p>
        <p>Мсяц до оплаты
            <input onchange="calculateLoan()" class="input" type="number" id="Месяц-до-оплаты"
            min="6" max="48" value="12">
        </p>
         <p class="payment" id="payment">Ежемесячная Оплата:</p>
    </div>

    <script src="index.js"></script>
</body>
</html>
